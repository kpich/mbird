[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mbird-diffusion"
version = "0.1.0"
description = "Audio diffusion models for mbird (infilling and expansion)"
requires-python = ">=3.10, <4"
dependencies = [
    "mbird-data",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "diffusers>=0.25.0",
    "transformers>=4.35.0",
    "audio-diffusion-pytorch>=0.0.95",
    "stable-audio-tools>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbird_diffusion = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["SIM108"]  # Allow if-else over ternary for readability

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
known-first-party = ["mbird_diffusion", "mbird_audiogen", "mbird_data"]
